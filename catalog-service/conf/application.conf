# Catalog Service Configuration
# Đợt 2: Thêm cấu hình Consul (Service Discovery)

# HTTP Server Configuration
# Cổng catalog-service instance 1: 9002 (instance 2 sẽ chạy 9012 với -Dhttp.port=9012)
play.server.http.port = 9002
play.server.http.port = ${?PLAY_HTTP_PORT}

# ============================================================================
# CONSUL CONFIGURATION - SERVICE DISCOVERY
# ============================================================================
# Đợt 2: Cấu hình Consul để đăng ký/hủy đăng ký dịch vụ tự động
consul.host = "localhost"
consul.host = ${?CONSUL_HOST}

consul.port = 8500
consul.port = ${?CONSUL_PORT}

service.name = "catalog-service"
service.host = "localhost"
service.host = ${?SERVICE_HOST}

service.port = 9002
service.port = ${?PLAY_HTTP_PORT}

service.instance.id = "catalog-1"
service.instance.id = ${?SERVICE_INSTANCE_ID}

# ============================================================================
# PLAY MODULES - ENABLE CONSUL MODULE
# ============================================================================
# Đợt 2: Tự động đăng ký service lên Consul khi khởi động
play.modules.enabled += "modules.ConsulModule"

# Database Configuration
db.default {
  driver = "com.microsoft.sqlserver.jdbc.SQLServerDriver"
  url = "jdbc:sqlserver://localhost:1433;databaseName=PharmacyManagementSOA;encrypt=false"
  url = ${?DATABASE_URL}
  username = "sa"
  username = ${?DATABASE_USER}
  password = "123456"
  password = ${?DATABASE_PASSWORD}
}

# Guice Modules
play.modules.enabled += "play.api.db.DBModule"
play.modules.enabled += "play.api.db.HikariCPModule"

# Application Secret
play.http.secret.key = "changeme-in-production"
play.http.secret.key = ${?APPLICATION_SECRET}
