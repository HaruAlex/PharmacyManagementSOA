# API Gateway Configuration
# Đợt 3: Thêm cấu hình filter logging và load balancer

# HTTP Server Configuration
play.server.http.port = 9000
play.server.http.port = ${?PLAY_HTTP_PORT}

# ============================================================================
# FILTER CONFIGURATION - REQUEST/RESPONSE LOGGING + IDEMPOTENCY
# ============================================================================
# Đợt 3: Enable filter để log request và thêm X-Served-By header
# Đợt 4: Enable IdempotencyFilter để xử lý Idempotency-Key

play.filters.enabled += "filters.RequestResponseLoggingFilter"
play.filters.enabled += "filters.IdempotencyFilter"

# CORS Configuration
play.filters.enabled += "play.filters.cors.CORSFilter"
play.filters.cors {
  pathPrefixes = ["/api", "/catalog"]
  allowedOrigins = ["http://localhost:3000", "http://localhost:8080"]
  allowedHttpMethods = ["GET", "HEAD", "POST", "PUT", "DELETE", "PATCH", "OPTIONS"]
  allowedHttpHeaders = ["Accept", "Content-Type", "Authorization", "X-Request-Id", "X-Branch-Id", "Idempotency-Key"]
  exposedHeaders = ["X-Served-By", "X-Request-Id"]
  supportsCredentials = true
  preflightMaxAge = 3600
}

# ============================================================================
# TIMEOUT CONFIGURATION - RESILIENCE
# ============================================================================
# Đợt 4: Timeout kết nối + đọc cho gọi service
# Đợt 5: Bulkhead timeout

# Play server request timeout
play.server.requestTimeout = 120s

# Service call timeout (milliseconds)
# - Connection timeout: 5 seconds (tối đa bao lâu để thiết lập kết nối)
# - Read timeout: 10 seconds (tối đa bao lâu để nhận response)
# - Bulkhead timeout: 5 seconds (tối đa bao lâu để chờ thread pool)
service.call.connectionTimeoutMs = 5000
service.call.readTimeoutMs = 10000
service.call.bulkheadTimeoutMs = 5000

# Retry configuration
# - Max retries: 2 (1 request chính + 2 retry)
# - Base backoff: 100ms (exponential: 100ms, 200ms)
service.retry.maxAttempts = 3
service.retry.baseBackoffMs = 100

# ============================================================================
# CIRCUIT BREAKER CONFIGURATION - RESILIENCE
# ============================================================================
# Đợt 5: Circuit Breaker

circuit-breaker {
    # Khi bao nhiêu failures thì OPEN circuit
    failure-threshold = 5
    
    # Khi bao nhiêu successes (trong HALF_OPEN) thì CLOSE circuit
    success-threshold = 2
    
    # Timeout (giây) trước khi HALF_OPEN
    timeout-seconds = 30
    
    # Window size (đếm failures trong N requests gần nhất)
    window-size = 10
}

# ============================================================================
# BULKHEAD CONFIGURATION - RESILIENCE
# ============================================================================
# Đợt 5: Bulkhead (Thread Pool Isolation)

bulkhead {
    # Số threads trong pool mỗi service
    core-pool-size = 10
    
    # Max size queue (khi queue full thì reject)
    max-queue-size = 5
    
    # Keep alive time (seconds)
    keep-alive-seconds = 60
    
    # Rejection policy: abort = reject when full
    rejection-policy = "abort"
}

# Application Secret
play.http.secret.key = "abcdefghijklmnopqrstuvwxyz01234567890abcdefghijklmnopqrstuvwxyz0123"
play.http.secret.key = ${?APPLICATION_SECRET}

# ============================================================================
# CONSUL CONFIGURATION - SERVICE DISCOVERY
# ============================================================================
# Đợt 2: API Gateway hỏi Consul thay vì hard-code URL
consul.host = "localhost"
consul.host = ${?CONSUL_HOST}

consul.port = 8500
consul.port = ${?CONSUL_PORT}
consul.address = ${?CONSUL_ADDRESS}
consul.discovery.cache-ttl-ms = 1000
consul.health.interval = "10s"
consul.health.timeout = "3s"
consul.health.deregister-after = "1m"

service.name = "api-gateway"
service.address = ${?SERVICE_ADDRESS}
service.host = ${?SERVICE_HOST}
service.port = ${play.server.http.port}
service.instance.id = ${?SERVICE_INSTANCE_ID}
# Các module cần thiết
play.modules.enabled += "services.GatewayModule"
play.modules.enabled += "modules.StartupModule"
play.modules.enabled += "integration.consul.ConsulModule"

gateway {
  timeout-ms = 10000
  max-attempts = 3
  routes = [
    { public-prefix = "/api/auth", service-name = "auth-service", upstream-prefix = "" },
    { public-prefix = "/api/users", service-name = "auth-service", upstream-prefix = "" },
    { public-prefix = "/api/roles", service-name = "auth-service", upstream-prefix = "" },
    { public-prefix = "/api/permissions", service-name = "auth-service", upstream-prefix = "" },
    { public-prefix = "/api/audit-logs", service-name = "auth-service", upstream-prefix = "" },
    { public-prefix = "/catalog", service-name = "catalog-service", upstream-prefix = "" },
    { public-prefix = "/api/purchase", service-name = "purchase-service", upstream-prefix = "" },
    { public-prefix = "/api/inventory/ledger", service-name = "inventory-service", upstream-prefix = "/api/v1/inventory/ledger" },
    { public-prefix = "/api/inventory/transfers", service-name = "inventory-service", upstream-prefix = "/api/v1/inventory/transfers" },
    { public-prefix = "/api/inventory/drug-lots", service-name = "inventory-service", upstream-prefix = "/api/drug-lots" },
    { public-prefix = "/api/inventory", service-name = "inventory-service", upstream-prefix = "/api/inventory" },
    { public-prefix = "/api/sales", service-name = "sales-service", upstream-prefix = "" },
    { public-prefix = "/report", service-name = "report-service", upstream-prefix = "" }
  ]
  public-routes = [
    { path-prefix = "/api/auth/login", methods = ["POST"], exact = true },
    { path-prefix = "/api/auth/refresh", methods = ["POST"], exact = true }
  ]
  role-rules = [
    { path-prefix = "/api/auth", methods = ["GET", "HEAD", "POST", "PUT", "PATCH", "DELETE"], roles = ["AD", "WH", "SP"] },
    { path-prefix = "/api/users", methods = ["GET", "HEAD", "POST", "PUT", "PATCH", "DELETE"], roles = ["AD"] },
    { path-prefix = "/api/roles", methods = ["GET", "HEAD", "POST", "PUT", "PATCH", "DELETE"], roles = ["AD"] },
    { path-prefix = "/api/permissions", methods = ["GET", "HEAD", "POST", "PUT", "PATCH", "DELETE"], roles = ["AD"] },
    { path-prefix = "/api/audit-logs", methods = ["GET", "HEAD", "POST"], roles = ["AD"] },
    { path-prefix = "/api/purchase", methods = ["GET", "HEAD", "POST", "PUT", "PATCH", "DELETE"], roles = ["AD", "WH"] },
    { path-prefix = "/api/inventory", methods = ["GET", "HEAD"], roles = ["AD", "WH", "SP"] },
    { path-prefix = "/api/inventory", methods = ["POST", "PUT", "PATCH", "DELETE"], roles = ["AD", "WH"] },
    { path-prefix = "/api/sales", methods = ["GET", "HEAD", "POST", "PUT", "PATCH", "DELETE"], roles = ["AD", "SP"] },
    { path-prefix = "/catalog", methods = ["GET", "HEAD"], roles = ["AD", "WH", "SP"] },
    { path-prefix = "/catalog/api/v1/catalog/customers", methods = ["POST", "PUT", "DELETE"], roles = ["AD", "SP"] },
    { path-prefix = "/catalog", methods = ["POST", "PUT", "PATCH", "DELETE"], roles = ["AD"] },
    { path-prefix = "/report", methods = ["GET", "HEAD", "POST", "PUT", "PATCH", "DELETE"], roles = ["AD", "WH", "SP"] }
  ]
}

jwt.secret = "default-secret-key-for-development-min-32-bytes"
jwt.secret = ${?JWT_SECRET}
jwt.clock-skew-seconds = 30
