# API Gateway Configuration
# Đợt 3: Thêm cấu hình filter logging và load balancer

# HTTP Server Configuration
play.server.http.port = 9000
play.server.http.port = ${?PLAY_HTTP_PORT}

# ============================================================================
# FILTER CONFIGURATION - REQUEST/RESPONSE LOGGING + IDEMPOTENCY
# ============================================================================
# Đợt 3: Enable filter để log request và thêm X-Served-By header
# Đợt 4: Enable IdempotencyFilter để xử lý Idempotency-Key

play.filters.enabled += "filters.RequestResponseLoggingFilter"
play.filters.enabled += "filters.IdempotencyFilter"

# CORS Configuration
play.filters.enabled += "play.filters.cors.CORSFilter"
play.filters.cors {
  pathPrefixes = ["/api"]
  allowedOrigins = ["http://localhost:3000", "http://localhost:8080"]
  allowedHttpMethods = ["GET", "POST", "PUT", "DELETE", "PATCH", "OPTIONS"]
  allowedHttpHeaders = ["Accept", "Content-Type", "Authorization", "X-Request-Id", "Idempotency-Key"]
  exposedHeaders = ["X-Served-By", "X-Request-Id"]
  supportsCredentials = true
  preflightMaxAge = 3600
}

# ============================================================================
# TIMEOUT CONFIGURATION - RESILIENCE
# ============================================================================
# Đợt 4: Timeout kết nối + đọc cho gọi service

# Play server request timeout
play.server.requestTimeout = 120s

# Service call timeout (milliseconds)
# - Connection timeout: 5 seconds (tối đa bao lâu để thiết lập kết nối)
# - Read timeout: 10 seconds (tối đa bao lâu để nhận response)
service.call.connectionTimeoutMs = 5000
service.call.readTimeoutMs = 10000

# Retry configuration
# - Max retries: 2 (1 request chính + 2 retry)
# - Base backoff: 100ms (exponential: 100ms, 200ms)
service.retry.maxAttempts = 3
service.retry.baseBackoffMs = 100

# Application Secret
play.http.secret.key = "abcdefghijklmnopqrstuvwxyz01234567890abcdefghijklmnopqrstuvwxyz0123"
play.http.secret.key = ${?APPLICATION_SECRET}

# ============================================================================
# CONSUL CONFIGURATION - SERVICE DISCOVERY
# ============================================================================
# Đợt 2: API Gateway hỏi Consul thay vì hard-code URL
consul.host = "localhost"
consul.host = ${?CONSUL_HOST}

consul.port = 8500
consul.port = ${?CONSUL_PORT}

# Đợt 3: Gateway cũng cần instance.id để log và header response
service.instance.id = "gateway-1"
service.instance.id = ${?SERVICE_INSTANCE_ID}
# Gateway không đăng ký lên Consul (chỉ dùng Consul để discover service)
# Các module cần thiết
play.modules.enabled += "services.GatewayModule"
