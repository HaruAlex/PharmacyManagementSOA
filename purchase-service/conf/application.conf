# Purchase Service Configuration

# HTTP Server Configuration
# Đợt 1: Sửa cổng theo bảng Server – Cổng (9004 cho purchase-service, tránh trùng inventory-service)
play.server.http.port = 9004
play.server.http.port = ${?PLAY_HTTP_PORT}

# Database Configuration
db.default {
  driver = "com.microsoft.sqlserver.jdbc.SQLServerDriver"
  url = "jdbc:sqlserver://localhost:1433;databaseName=PharmacyManagementSOA;encrypt=false"
  url = ${?DATABASE_URL}
  username = "sa"
  username = ${?DATABASE_USER}
  password = "123456"
  password = ${?DATABASE_PASSWORD}
}

# Guice Modules
play.modules.enabled += "play.api.db.DBModule"
play.modules.enabled += "play.api.db.HikariCPModule"

# Application Secret
play.http.secret.key = "changeme-in-production"
play.http.secret.key = ${?APPLICATION_SECRET}
