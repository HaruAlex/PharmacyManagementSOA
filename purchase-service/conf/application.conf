# Purchase Service Configuration

# HTTP Server Configuration
# Đợt 1: Sửa cổng theo bảng Server – Cổng (9004 cho purchase-service, tránh trùng inventory-service)
# Đợt 2: Thêm cấu hình Consul (Service Discovery)
play.server.http.port = 9004
play.server.http.port = ${?PLAY_HTTP_PORT}

# ============================================================================
# CONSUL CONFIGURATION - SERVICE DISCOVERY
# ============================================================================
# Đợt 2: Cấu hình Consul để đăng ký/hủy đăng ký dịch vụ tự động
consul.host = "localhost"
consul.host = ${?CONSUL_HOST}

consul.port = 8500
consul.port = ${?CONSUL_PORT}
consul.address = ${?CONSUL_ADDRESS}
consul.discovery.cache-ttl-ms = 1000
consul.health.interval = "10s"
consul.health.timeout = "3s"
consul.health.deregister-after = "1m"

service.name = "purchase-service"
service.address = ${?SERVICE_ADDRESS}
service.host = ${?SERVICE_HOST}
service.port = ${play.server.http.port}
service.instance.id = ${?SERVICE_INSTANCE_ID}

# ============================================================================
# PLAY MODULES - ENABLE CONSUL MODULE & DATABASE
# ============================================================================
# Đợt 2: Tự động đăng ký service lên Consul khi khởi động
play.modules.enabled += "modules.StartupModule"
play.modules.enabled += "integration.consul.ConsulModule"
play.modules.enabled += "play.db.DBModule"
play.modules.enabled += "play.api.db.HikariCPModule"

# Database Configuration
db.default {
  driver = "com.microsoft.sqlserver.jdbc.SQLServerDriver"
  url = "jdbc:sqlserver://localhost:1433;databaseName=PharmacyManagementSOA;encrypt=false"
  url = ${?DATABASE_URL}
  username = "sa"
  username = ${?DATABASE_USER}
  password = "123456"
  password = ${?DATABASE_PASSWORD}
}
play.modules.enabled += "play.db.DBModule"

# Application Secret
play.http.secret.key = "abcdefghijklmnopqrstuvwxyz01234567890abcdefghijklmnopqrstuvwxyz0123"
play.http.secret.key = ${?APPLICATION_SECRET}
