# Auth Service Configuration
# Đợt 2: Thêm cấu hình Consul (Service Discovery)

# HTTP Server Configuration
# Cổng auth-service instance 1: 9001 (instance 2 sẽ chạy 9011 với -Dhttp.port=9011)
play.server.http.port = 9001
play.server.http.port = ${?PLAY_HTTP_PORT}

# Allow all hosts (disable host filter for development)
play.filters.hosts {
  allowed = ["."]
}

# ============================================================================
# CONSUL CONFIGURATION - SERVICE DISCOVERY
# ============================================================================
# Đợt 2: Cấu hình Consul để đăng ký/hủy đăng ký dịch vụ tự động
# 
# Thứ tự ưu tiên: system property (-Dconsul.host) > biến môi trường > giá trị mặc định
consul.host = "localhost"
consul.host = ${?CONSUL_HOST}

consul.port = 8500
consul.port = ${?CONSUL_PORT}

# Tên service trong Consul (dùng chung cho cả 2 instance)
service.name = "auth-service"

# Host service (mặc định localhost, có thể override)
service.host = "localhost"
service.host = ${?SERVICE_HOST}

# Cổng service (lấy từ play.server.http.port)
service.port = 9001
service.port = ${?PLAY_HTTP_PORT}

# Instance ID duy nhất (lấy từ system property: -Dservice.instance.id=auth-1)
# Nếu không truyền, mặc định là auth-1
service.instance.id = "auth-1"
service.instance.id = ${?SERVICE_INSTANCE_ID}

# ============================================================================
# PLAY MODULES - ENABLE CONSUL MODULE & DATABASE
# ============================================================================
# Đợt 2: Tự động đăng ký service lên Consul khi khởi động
play.modules.enabled += "modules.ConsulModule"
play.modules.enabled += "play.db.DBModule"
play.modules.enabled += "play.api.db.HikariCPModule"

# Database Configuration
db.default {
  driver = "com.microsoft.sqlserver.jdbc.SQLServerDriver"
  url = "jdbc:sqlserver://localhost:1433;databaseName=PharmacyManagementSOA;encrypt=false"
  url = ${?DATABASE_URL}
  username = "sa"
  username = ${?DATABASE_USER}
  password = "123456"
  password = ${?DATABASE_PASSWORD}
}

# Application Secret
play.http.secret.key = "abcdefghijklmnopqrstuvwxyz01234567890abcdefghijklmnopqrstuvwxyz0123"
play.http.secret.key = ${?APPLICATION_SECRET}
