# Auth Service Configuration

# HTTP Server Configuration
play.server.http.port = 9001
play.server.http.port = ${?PLAY_HTTP_PORT}

# Allow all hosts (disable host filter for development)
play.filters.hosts {
  allowed = ["."]
}

play.filters.enabled += "play.filters.cors.CORSFilter"

play.filters.cors {
  pathPrefixes = ["/api"]
  allowedOrigins = []
  allowedHttpMethods = ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
  allowedHttpHeaders = ["Accept", "Authorization", "Content-Type", "Origin"]
  supportsCredentials = false
}

play.filters.headers {
  frameOptions = "DENY"
  xssProtection = "1; mode=block"
  contentTypeOptions = "nosniff"
  referrerPolicy = "strict-origin-when-cross-origin"
}

# ============================================================================
# CONSUL CONFIGURATION - SERVICE DISCOVERY
# ============================================================================
consul.host = "localhost"
consul.host = ${?CONSUL_HOST}

consul.port = 8500
consul.port = ${?CONSUL_PORT}
consul.address = ${?CONSUL_ADDRESS}
consul.discovery.cache-ttl-ms = 1000
consul.health.interval = "10s"
consul.health.timeout = "3s"
consul.health.deregister-after = "1m"

service.name = "auth-service"
service.address = ${?SERVICE_ADDRESS}
service.host = ${?SERVICE_HOST}
service.port = ${play.server.http.port}
service.instance.id = ${?SERVICE_INSTANCE_ID}

# ============================================================================
# PLAY MODULES
# ============================================================================
play.modules.enabled += "modules.AuthModule"
play.modules.enabled += "modules.StartupModule"
play.modules.enabled += "integration.consul.ConsulModule"

# Error Handler
play.http.errorHandler = "errors.ErrorHandler"

# Disable Evolutions
play.evolutions.enabled = false

# ============================================================================
# DATABASE CONFIGURATION
# ============================================================================
db.default {
  driver = "com.microsoft.sqlserver.jdbc.SQLServerDriver"
  url = "jdbc:sqlserver://localhost:1433;databaseName=PharmacyManagementSOA;encrypt=false;trustServerCertificate=true"
  url = ${?DATABASE_URL}
  username = "sa"
  username = ${?DATABASE_USER}
  password = "123456"
  password = ${?DATABASE_PASSWORD}
  
  # HikariCP settings
  hikaricp {
    maximumPoolSize = 20
    minimumIdle = 5
    connectionTimeout = 30000
    idleTimeout = 600000
    maxLifetime = 1800000
  }
}

# Database dispatcher (blocking operations)
database.dispatcher {
  executor = "thread-pool-executor"
  throughput = 1
  thread-pool-executor {
    fixed-pool-size = 20
  }
}

# ============================================================================
# JWT & SECURITY CONFIGURATION
# ============================================================================
jwt {
  secret = "default-secret-key-for-development-min-32-bytes"
  secret = ${?JWT_SECRET}
  accessTokenMinutes = 15
  refreshTokenDays = 7
}

auth {
  maxFailedAttempts = 5
  userStatusCacheSeconds = 10
}

# Rate limit trên từng instance Auth Service
security.rateLimit {
  login {
    maxPerIdentity = 10
    maxPerIp = 100
    windowSeconds = 900
  }
  refresh {
    maxPerIdentity = 10
    maxPerIp = 30
    windowSeconds = 60
  }
  changePassword {
    maxPerIdentity = 10
    maxPerIp = 100
    windowSeconds = 900
  }
}

# Password policy
password.policy {
  minLength = 8
  requireUppercase = true
  requireLowercase = true
  requireDigit = true
  requireSpecialChar = true
}

# ============================================================================
# ADMIN DEV SEEDER CONFIGURATION
# ============================================================================
seed {
  enableDevAdmin = true
  enableDevAdmin = ${?SEED_ENABLE_DEV_ADMIN}
  
  admin {
    username = "admin.demo"
    email = "admin@example.local"
    password = "Admin@12345"
  }
  
  warehouse {
    username = "warehouse.demo"
    email = "warehouse@example.local"
    password = "Warehouse@12345"
  }
  
  pharmacist {
    username = "pharmacist.demo"
    email = "pharmacist@example.local"
    password = "Pharmacist@12345"
  }
}

# ============================================================================
# CATALOG SERVICE CLIENT
# ============================================================================
catalog.service {
  name = "catalog-service"
  timeout-ms = 5000
  activeBranchesPath = "/api/v1/catalog/branches"
}

# Application Secret
play.http.secret.key = "abcdefghijklmnopqrstuvwxyz01234567890abcdefghijklmnopqrstuvwxyz0123"
play.http.secret.key = ${?APPLICATION_SECRET}
