# ============================================================================
# BẢNG ĐỊNH NGHĨA SERVER – CỔNG
# ============================================================================
# File cấu hình tập trung cho tất cả services
# Mỗi service nghiệp vụ chạy 2 instance:
#   Instance 1: cổng gốc (9001-9006)
#   Instance 2: cổng = Instance 1 + 10 (9011-9016)
# 
# Sử dụng bởi: scripts (start-all.sh, stop-all.sh, status.sh)
# 
# Format: SERVICE_NAME|CONSUL_NAME|INSTANCE_1_ID|INSTANCE_1_PORT|INSTANCE_2_ID|INSTANCE_2_PORT
# ============================================================================

# Gateway (1 instance)
GATEWAY|api-gateway|gateway-1|9000

# Frontend Node.js (1 instance)
FRONTEND|frontend-none|frontend-1|8080

# Services (2 instance mỗi cái)
AUTH|auth-service|auth-1|9001|auth-2|9011
CATALOG|catalog-service|catalog-1|9002|catalog-2|9012
INVENTORY|inventory-service|inventory-1|9003|inventory-2|9013
PURCHASE|purchase-service|purchase-1|9004|purchase-2|9014
SALES|sales-service|sales-1|9005|sales-2|9015
REPORT|report-service|report-1|9006|report-2|9016

# Hạ tầng
CONSUL|consul|consul-1|8500

# ============================================================================
# THỨ TỰ KHỞI ĐỘNG: Services trước, Gateway, Frontend cuối
# THỨ TỰ DỪNG: Frontend, Gateway, Services (ngược lại)
# ============================================================================
