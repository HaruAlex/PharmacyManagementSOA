# ============================================================================
# BẢNG CẤU HÌNH SERVER – CỔNG
# ============================================================================
# Đợt 1: File cấu hình chính định nghĩa tất cả các server, cổng, instance ID
# Được sử dụng bởi start-all.sh, stop-all.sh, status.sh để quản lý dễ dàng
#
# Mỗi dòng: SERVICE_NAME|CONSUL_SERVICE_NAME|INSTANCE_1|PORT_1|INSTANCE_2|PORT_2
# Trong đó:
#   SERVICE_NAME: tên thư mục service (vd auth-service, catalog-service)
#   CONSUL_SERVICE_NAME: tên service trong Consul (vd auth-service, catalog-service)
#   INSTANCE_1: tên instance 1 (vd auth-1)
#   PORT_1: cổng instance 1 (vd 9001)
#   INSTANCE_2: tên instance 2 (vd auth-2)
#   PORT_2: cổng instance 2 = PORT_1 + 10 (vd 9011)
# ============================================================================

# Frontend (Node.js) - chỉ 1 instance
frontend|frontend|frontend-1|8080|||

# API Gateway (Play Framework, Java) - chỉ 1 instance
api-gateway|api-gateway|gateway-1|9000|||

# 6 Service nghiệp vụ (mỗi service 2 instance)
auth-service|auth-service|auth-1|9001|auth-2|9011
catalog-service|catalog-service|catalog-1|9002|catalog-2|9012
inventory-service|inventory-service|inventory-1|9003|inventory-2|9013
purchase-service|purchase-service|purchase-1|9004|purchase-2|9014
sales-service|sales-service|sales-1|9005|sales-2|9015
report-service|report-service|report-1|9006|report-2|9016

# ============================================================================
# Tổng: 14 tiến trình (1 frontend + 1 gateway + 6 service × 2 instance)
# Cổng hạ tầng: Consul 8500, SQL Server 1433
# ============================================================================
